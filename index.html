<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mercari 2026 选品日历</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2716%27 fill=%27%23FF0211%27/%3E%3Ctext x=%2732%27 y=%2745%27 font-size=%2738%27 font-family=%27Arial,sans-serif%27 font-weight=%27800%27 text-anchor=%27middle%27 fill=%27white%27%3EM%3C/text%3E%3C/svg%3E">
<style>
:root{
 --font:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","PingFang SC","Noto Sans JP","Noto Sans SC","Noto Sans CJK SC","Yu Gothic","YuGothic","Microsoft YaHei","Segoe UI",sans-serif;
 --bg:#F6F6F8;--panel:#FFFFFF;--panel2:#FAFAFB;--text:#1A1A1F;--muted:#6B6B76;--faint:#A0A0AA;--line:#E8E8EE;
 --accent:#FF0211;--accent-soft:#FFF0F1;--shadow:0 1px 2px rgba(16,16,32,.04),0 4px 16px rgba(16,16,32,.06);
 --shadow-lg:0 10px 30px rgba(16,16,32,.14);--r:14px;
 --c-holiday:#E5484D;--c-season:#2F9E77;--c-kinenbi:#7C5CFC;--c-mercari:#FF0211;--c-inferred:#E8A200;
}
[data-theme=dark]{--bg:#111114;--panel:#1A1A1F;--panel2:#202027;--text:#EDEDF2;--muted:#A3A3AE;--faint:#6E6E78;--line:#2C2C34;--accent-soft:#3A1418;--shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.3);--shadow-lg:0 10px 30px rgba(0,0,0,.5)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
a{color:inherit}
header.top{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--panel) 86%,transparent);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--line)}
.bar{max-width:1320px;margin:0 auto;padding:10px 20px 0;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:.2px}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#FF0211,#FF5A63);display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;box-shadow:0 4px 12px rgba(255,2,17,.3)}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.spacer{flex:1}
.iconbtn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;height:34px;padding:0 12px;font:inherit;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.2s}
.iconbtn:hover{border-color:var(--accent);color:var(--accent)}
nav.tabs{max-width:1320px;margin:0 auto;padding:8px 20px 10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid transparent;background:transparent;color:var(--muted);font:inherit;font-size:13.5px;font-weight:600;padding:6px 13px;border-radius:999px;cursor:pointer;transition:.2s;position:relative}
.tab:hover{color:var(--text);background:var(--panel2)}
.tab.on{background:var(--text);color:var(--panel)}
.tab.cat{color:var(--accent)}
.tab.cat.on{background:var(--accent);color:#fff}
.tab .dot{position:absolute;top:4px;right:6px;width:5px;height:5px;border-radius:50%;background:var(--c-holiday)}
.sep{width:1px;background:var(--line);margin:4px 4px;flex:0 0 auto}
main{max-width:1320px;margin:0 auto;padding:20px}
#view{transition:opacity .28s ease,transform .28s ease}
#view.leaving{opacity:0;transform:translateY(8px)}
.legend{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px 3px 8px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--text);white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.hero h1{margin:0;font-size:28px;letter-spacing:-.3px;line-height:1.15}
.hero h1 span{background:linear-gradient(90deg,#FF0211,#FF6A3D);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:4px 0 0;color:var(--muted);font-size:13px}
.navarrows{display:flex;gap:6px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.monthgrid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.cal{padding:14px}
.dow,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dow div{font-size:11.5px;text-transform:none;font-weight:700;color:var(--muted);text-align:center;padding:4px 0;letter-spacing:.5px}
.dow em{font-style:normal;font-weight:500;color:var(--faint)}
.dow div:nth-child(6){color:#3B7DDD}.dow div:nth-child(7){color:var(--c-holiday)}
.day{position:relative;min-height:112px;border-radius:10px;background:var(--panel2);border:1px solid transparent;padding:6px 6px 14px;cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s;overflow:hidden}
.day:hover{border-color:var(--line);box-shadow:var(--shadow);transform:translateY(-1px);background:var(--panel)}
.day.out{background:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in srgb,var(--line) 45%,transparent) 6px 7px);border:1px dashed var(--line);cursor:default;opacity:.55}
.day.out:hover{transform:none;box-shadow:none;border-color:transparent}
.day .n{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.day.sat{background:color-mix(in srgb,#3B7DDD 4%,var(--panel2))}.day.sun{background:color-mix(in srgb,var(--c-holiday) 4%,var(--panel2))}
.day.sat .n{color:#3B7DDD}.day.sun .n,.day.hol .n{color:var(--c-holiday)}
.day.hol{background:color-mix(in srgb,var(--c-holiday) 7%,var(--panel2))}
.day.bandday{background:linear-gradient(180deg,var(--panel2) 70%,color-mix(in srgb,var(--c-inferred) 9%,var(--panel2)))}
.day.today{outline:2px solid var(--accent);outline-offset:-2px}
.day .ev{display:block;font-size:11.5px;line-height:1.4;margin-top:3px;padding:1px 6px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.ev.holiday{background:color-mix(in srgb,var(--c-holiday) 14%,transparent);color:var(--c-holiday)}
.ev.season{background:color-mix(in srgb,var(--c-season) 14%,transparent);color:var(--c-season)}
.ev.kinenbi{background:color-mix(in srgb,var(--c-kinenbi) 14%,transparent);color:var(--c-kinenbi)}
.ev.mercari{background:color-mix(in srgb,var(--c-mercari) 12%,transparent);color:var(--c-mercari)}
.ev.inf{border:1px dashed var(--c-inferred)}
.bands{position:absolute;left:0;right:0;bottom:3px;display:flex;flex-direction:column;gap:2px;padding:0 4px}
.band{height:3px;border-radius:3px;opacity:.6}
.band.season{background:var(--c-season);opacity:.55}
.band.inf{background:repeating-linear-gradient(135deg,var(--c-inferred) 0 4px,color-mix(in srgb,var(--c-inferred) 40%,transparent) 4px 8px);opacity:.9}
.more{font-size:11px;font-weight:700;color:var(--muted);margin-top:3px;padding-left:2px}
.side{padding:14px;display:flex;flex-direction:column;gap:12px}
.side h3,.sec h2{margin:0;font-size:14px;letter-spacing:.2px}
.evlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.evlist li{display:flex;gap:10px;align-items:flex-start;padding:7px 8px;border-radius:9px;transition:background .15s}
.evlist li:hover{background:var(--panel2)}
.evlist .d{flex:0 0 52px;font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.evlist .t{font-size:13px;font-weight:600}
.evlist .s{font-size:11.5px;color:var(--muted)}
.bullet{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:0 0 8px}
.placeholder{border:1.5px dashed color-mix(in srgb,var(--c-mercari) 45%,var(--line));background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--text)}
.placeholder b{color:var(--accent)}
.sec{margin-top:26px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.sechead h2{font-size:20px}
.sechead .sub{color:var(--muted);font-size:12.5px}
.catblock{padding:16px 16px 18px;margin-bottom:14px}
.cathead{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.cathead h3{margin:0;font-size:16.5px}
.cathead .reason{color:var(--muted);font-size:13px;margin-top:2px}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--c-inferred) 16%,transparent);color:#A87400;margin-left:6px;vertical-align:2px}
[data-theme=dark] .badge{color:#F3C04F}
.badge.off{background:color-mix(in srgb,var(--c-mercari) 12%,transparent);color:var(--accent)}
.badge.cxl{background:var(--panel2);color:var(--faint);border:1px solid var(--line);text-decoration:none}
li.cxl{opacity:.6}li.cxl s{color:var(--muted);text-decoration-thickness:1.5px}
.ev.cxl{background:var(--panel2)!important;color:var(--faint)!important;text-decoration:line-through}
.badge.inf{background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.evd{font-size:12px;margin-top:6px;padding:6px 10px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0;max-width:820px}
.evd a{color:var(--accent);font-weight:700;text-decoration:none}
.evlist.cap,.merlist{max-height:300px;overflow:auto;padding-right:4px;scrollbar-width:thin}
.mg-grp{border:1px solid var(--line);border-radius:10px;padding:2px 6px;margin-top:6px}
.mg-grp summary{cursor:pointer;font-size:12.5px;font-weight:700;padding:6px 4px;list-style:none;display:flex;justify-content:space-between;align-items:center}
.mg-grp summary::-webkit-details-marker{display:none}
.mg-grp summary::after{content:"▾";color:var(--muted);transition:transform .2s}
.mg-grp:not([open]) summary::after{transform:rotate(-90deg)}
.mg-grp summary .c{font-size:11px;color:var(--muted);font-weight:600;margin-left:auto;margin-right:6px}
.merlist .badge{font-size:10px;margin-left:2px;padding:1px 6px}
.rep{padding:16px}
.rep details{border-top:1px solid var(--line);padding:10px 0}
.rep summary{cursor:pointer;font-weight:700;font-size:14px;list-style:none;display:flex;align-items:center;gap:6px}
.rep summary::-webkit-details-marker{display:none}
.rep summary::before{content:"▸";color:var(--muted);transition:transform .2s;display:inline-block}
.rep details[open] summary::before{transform:rotate(90deg)}
.rep .s,.sub .s{color:var(--muted);font-weight:500;font-size:11.5px}
.hcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-top:10px}
.hc{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel2);font-size:12px;transition:box-shadow .2s,transform .2s}
.hc:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.hn{font-weight:800;font-size:13px;margin-bottom:4px}
.hnote{color:var(--muted);margin-bottom:4px}
.hc ul{margin:0;padding-left:16px}.hc li{margin:2px 0}
.hsrc{font-size:11px;color:var(--accent);text-decoration:none}
.tsrow{padding:8px 0;border-bottom:1px dashed var(--line)}
.tss{font-weight:700;font-size:12.5px;margin-bottom:4px}
.kw{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:3px 0}
.kw em{font-style:normal;font-size:10.5px;color:var(--muted);width:52px}
.kw span{font-size:11.5px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.kw span b{color:var(--accent);margin-right:3px}
.tips{margin:8px 0 0;padding-left:18px;font-size:12.5px}.tips li{margin:4px 0}
.badge.m{background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.links{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.lnk{font-size:12px;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--muted);transition:.2s;white-space:nowrap}
.lnk:hover{border-color:var(--accent);color:var(--accent)}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(188px,1fr));gap:14px}
.pc{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s;color:inherit;text-decoration:none}
.pc:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.pc .img{position:relative;aspect-ratio:1/1;background:#fff;overflow:hidden;display:grid;place-items:center}
.pc .img img{width:100%;height:100%;object-fit:contain;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.pc:hover .img img{transform:scale(1.07)}
.pc .img .fb{font-size:12px;color:#888;padding:10px;text-align:center}
.site{position:absolute;top:8px;left:8px;font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:999px;color:#fff;letter-spacing:.3px}
.site.rakuten{background:#BF0000}.site.amazon{background:#232F3E}
.pc .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.pc .title{font-size:12.5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px}
.price{color:var(--accent);font-weight:800;font-size:18px;letter-spacing:-.2px;font-variant-numeric:tabular-nums}
.price small{font-size:11px;font-weight:600;color:var(--muted);margin-left:4px}
.stars{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}
.st{position:relative;display:inline-block;font-size:12px;letter-spacing:1px;color:#D9D9E0;line-height:1}
.st b{position:absolute;left:0;top:0;overflow:hidden;white-space:nowrap;color:#FFB400;font-weight:400}
.cta{margin-top:auto;display:block;text-align:center;font-size:12.5px;font-weight:700;padding:8px 0;border-radius:10px;background:var(--accent);color:#fff;transition:filter .2s}
.cta.amazon{background:#232F3E}
.pc:hover .cta{filter:brightness(1.08)}
.meta{font-size:10.5px;color:var(--faint)}
.year{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.mini{padding:14px;cursor:pointer;transition:transform .2s,box-shadow .2s}
.mini:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.mini h3{margin:0 0 8px;font-size:15px;display:flex;justify-content:space-between;align-items:baseline}
.mini h3 small{font-size:11px;color:var(--muted);font-weight:500}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:11px;text-align:center;font-variant-numeric:tabular-nums}
.mg div{padding:3px 0;border-radius:5px;position:relative}
.mg .h{color:var(--muted);font-weight:700;font-size:10px}
.mg .hol{background:color-mix(in srgb,var(--c-holiday) 16%,transparent);color:var(--c-holiday);font-weight:700}
.mg .sun{color:var(--c-holiday)}.mg .sat{color:#3B7DDD}
.mg .k::after,.mg .s::after{content:"";position:absolute;bottom:1px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%}
.mg .s::after{background:var(--c-season)}.mg .mer{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--c-mercari) 55%,transparent)}.mg .k::after{background:var(--c-kinenbi)}
.mg .band{height:auto;border-radius:0;box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--c-season) 55%,transparent)}
.minicats{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.minicats span{font-size:11px;background:var(--panel2);border:1px solid var(--line);padding:1px 7px;border-radius:999px;color:var(--muted)}
table.dir{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.dir th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
.dir td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.dir tr{cursor:pointer;transition:background .15s}
.dir tbody tr:hover{background:var(--panel2)}
.dir tr.sel{background:var(--accent-soft)}
.mchips{display:grid;grid-template-columns:repeat(12,20px);gap:3px}
.mchips span{font-size:10px;font-weight:700;width:20px;text-align:center;padding:2px 0;border-radius:6px;background:var(--panel2);color:var(--faint);border:1px solid var(--line)}
.mchips span.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.cnt{font-weight:800;font-variant-numeric:tabular-nums}
.dirwrap{display:grid;grid-template-columns:minmax(0,600px) minmax(0,1fr);gap:16px;align-items:start}
.dirlist{max-height:calc(100vh - 170px);overflow:auto}
.dirdetail{position:sticky;top:120px}
.pop{position:fixed;z-index:100;max-width:320px;min-width:220px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);padding:12px 14px;font-size:12.5px;opacity:0;transform:translateY(4px) scale(.98);pointer-events:none;transition:opacity .16s,transform .16s}
.pop.show{opacity:1;transform:none}
.pop.pinned{pointer-events:auto}
.pop{max-height:min(70vh,520px);overflow:auto}
.pop .x{display:none;position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);font-size:16px;line-height:22px;text-align:center;cursor:pointer;padding:0}
.pop .x:hover{color:var(--accent);border-color:var(--accent)}
.pop.pinned .x{display:block}
.pop h4{padding-right:30px}
.pop h4{margin:0 0 8px;font-size:13.5px}
.pop .row{display:flex;gap:8px;margin-top:7px}
.pop .row .bullet{margin-top:5px}
.pop .src{color:var(--faint);font-size:11px}
footer{max-width:1320px;margin:30px auto 0;padding:20px 20px 40px;color:var(--muted);font-size:12.5px}
footer .card{padding:18px 20px}
.srcgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-top:10px}
.srcgrp{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--panel2)}
.srcgrp h4{margin:0 0 8px;font-size:12.5px;color:var(--text);display:flex;align-items:center;gap:6px}
.srcgrp h4 i{width:8px;height:8px;border-radius:50%}
.srcit{padding:7px 0;border-top:1px dashed var(--line);font-size:11.5px;color:var(--muted);line-height:1.5}
.srcit:first-of-type{border-top:0}
.srcit b{color:var(--text);font-weight:600;font-size:12px;display:block}
.srcit .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.srcit .chips a,.srcit .chips span{font-size:10.5px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--muted);text-decoration:none;white-space:nowrap}
.srcit .chips a:hover{color:var(--accent);border-color:var(--accent)}
.fnote{font-size:11.5px;color:var(--faint);margin-top:12px}
footer h3{margin:0 0 8px;font-size:14px;color:var(--text)}
footer ol{margin:6px 0 0;padding-left:18px}
footer li{margin:3px 0}
.note{margin-top:10px;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--c-inferred) 10%,transparent);border:1px solid color-mix(in srgb,var(--c-inferred) 35%,transparent);color:var(--text)}
.empty{color:var(--muted);font-size:13px;padding:30px;text-align:center}
@media (max-width:980px){.monthgrid,.dirwrap{grid-template-columns:1fr}.dirdetail{position:static}.dirlist{max-height:none}}
@media (max-width:640px){.dow em{display:none}main{padding:12px}.hero h1{font-size:22px}.day{min-height:62px;padding:4px 3px 10px}.day .ev{font-size:0;height:6px;padding:0;margin-top:3px}.dow,.days{gap:3px}.prods{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.brand small{display:none}.links{margin-left:0}}
@media print{header.top,.navarrows,.iconbtn,.pop{display:none!important}body{background:#fff;font-size:11px}.card,.pc{box-shadow:none;break-inside:avoid}.day{min-height:70px}.pc:hover{transform:none}.prods{grid-template-columns:repeat(4,1fr)}main{padding:0}#view{opacity:1!important;transform:none!important}a.lnk::after{content:""}}
</style>

function pinPop(d){showPop(d);pinned=true;pop.classList.add('pinned');const x=pop.querySelector('.x');if(x)x.focus({preventScroll:true})}

  if(instant){render(r);return}
  view.classList.add('leaving');setTimeout(()=>{render(r);window.scrollTo({top:0});requestAnimationFrame(()=>view.classList.remove('leaving'))},200)}
addEventListener('hashchange',()=>go(location.hash.slice(1)||'all'));
// theme

let saved=null;try{saved=localStorage.getItem('mc-theme')}catch(e){}
if(saved)setTheme(saved);else if(matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)setTheme('dark');
tb.onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');

go(h||(now.getFullYear()===Y?String(now.getMonth()+1):'all'),true);
